---
- name: Verificar se Docker CLI está disponível
  ansible.builtin.command: docker version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Verificar se Docker Compose v2 está disponível
  ansible.builtin.command: docker compose version
  register: docker_compose_check
  changed_when: false
  failed_when: false

- name: Instalar dependências básicas no Ubuntu/Debian quando Docker não estiver disponível
  become: yes
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - docker.io
    state: present
    update_cache: yes
  when:
    - ansible_os_family == "Debian"
    - docker_check.rc != 0

- name: Instalar Docker no RHEL/CentOS/Fedora quando Docker não estiver disponível
  become: yes
  ansible.builtin.yum:
    name:
      - docker
    state: present
  when:
    - ansible_os_family == "RedHat"
    - docker_check.rc != 0

- name: Habilitar e iniciar serviço Docker quando instalado localmente
  become: yes
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
  when: docker_check.rc != 0

- name: Validar Docker após configuração
  ansible.builtin.command: docker version
  register: docker_final_check
  changed_when: false

- name: Validar Docker Compose v2 após configuração
  ansible.builtin.command: docker compose version
  register: docker_compose_final_check
  changed_when: false

- name: Exibir versão do Docker
  ansible.builtin.debug:
    msg: "{{ docker_final_check.stdout_lines }}"

- name: Exibir versão do Docker Compose
  ansible.builtin.debug:
    msg: "{{ docker_compose_final_check.stdout_lines }}"
